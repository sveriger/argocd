---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: machine-controller
  namespace: argocd
spec:
  goTemplate: true
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - merge:
        mergeKeys: [server]
        generators:
          - clusters:
              values:
                # anything not staging or prod use this version
                addonVersion: machine-controller-v1.65.0
                addonRepository: https://github.com/valiton-k8s-blueprint/kustomize.git
          - clusters:
              selector:
                matchLabels:
                  environment: staging
              values:
                addonVersion: machine-controller-v1.65.0
          - clusters:
              selector:
                matchLabels:
                  environment: production
              values:
                addonVersion: machine-controller-v1.65.0
  template:
    metadata:
      name: machine-controller
      annotations:
        argocd.argoproj.io/compare-options: IncludeMutationWebhook=true
    spec:
      project: default
      source:
        repoURL: '{{.values.addonRepository}}'
        path: 'machine-controller'
        targetRevision: '{{.values.addonVersion}}'
        kustomize:
          images:
            - name: quay.io/kubermatic/machine-controller
              newTag: v1.65.0
          patches:
            - patch: |-
                - op: add
                  path: "/spec/template/spec/containers/0/env/-"
                  value:
                    name: OS_AUTH_URL
                    value: {{.metadata.annotations.openstack_auth_url}}
              target:
                kind: Deployment
                name: machine-controller
      destination:
        namespace: kube-system
        name: '{{.name}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
